<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архитектор Эха</title>
    <style>
        body, html { 
            margin: 0; padding: 0; overflow: hidden; 
            background: #000; 
            font-family: 'Courier New', monospace; 
            color: #0f0;
            cursor: none;
        }
        #start-screen {
            position: absolute; 
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.95); z-index: 999;
            text-align: center;
        }
        h1 { font-size: 3vw; text-shadow: 0 0 10px #0f0; margin-bottom: 10px; }
        p { font-size: 1.2vw; margin: 5px 0; }
        button { 
            padding: 15px 40px; font-size: 1.5vw; 
            background: #000; color: #0f0; border: 1px solid #0f0; 
            cursor: pointer; margin-top: 20px; transition: 0.3s;
        }
        button:hover { background: #0f0; color: #000; }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>АРХИТЕКТОР ЭХА</h1>
        <p>Наденьте наушники. Выключите свет.</p>
        <p>Кликни по экрану, чтобы захватить курсор.</p>
        <button id="startBtn">Вдохнуть</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/21.0.0/tween.umd.js"></script>

    <script>
        let scene, camera, renderer, composer;
        let listener, audioCtx, analyser, fearOsc, fearGain;
        let panicLevel = 0;
        let isRunning = false;
        let controls, keys = {}, speed = 0.1;

        function initScene() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000011, 0.05);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            composer = new THREE.EffectComposer(renderer);
            const renderPass = new THREE.RenderPass(scene, camera);
            composer.addPass(renderPass);
            const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            composer.addPass(bloomPass);
            const glitchPass = new THREE.GlitchPass();
            composer.addPass(glitchPass);

            const floorGeo = new THREE.PlaneGeometry(20, 20);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x222233, emissive: 0x111122, transparent: true, opacity: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const wall = new THREE.Mesh(new THREE.BoxGeometry(1, 3, 10), new THREE.MeshStandardMaterial({ color: 0x442211, emissive: 0x221100 }));
            wall.position.set(5, 1.5, 0);
            scene.add(wall);

            const light = new THREE.PointLight(0xff6600, 2, 10);
            light.position.set(0, 3, 0);
            scene.add(light);

            listener = new THREE.AudioListener();
            camera.add(listener);

            controls = new THREE.PointerLockControls(camera, document.body);
            document.body.addEventListener('click', function() { controls.lock(); });

            document.addEventListener('keydown', function(event) {
                keys[event.code] = true;
                if (event.code === 'Space' && isRunning) playClick();
            });
            document.addEventListener('keyup', function(event) { keys[event.code] = false; });
        }

        async function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.8;
                source.connect(analyser);
            } catch (e) { console.error('Микрофон недоступен.'); }

            fearOsc = audioCtx.createOscillator();
            fearOsc.type = 'sine';
            fearOsc.frequency.value = 19;
            fearGain = audioCtx.createGain();
            fearGain.gain.value = 0;
            fearOsc.connect(fearGain).connect(audioCtx.destination);
            fearOsc.start();
        }

        function playClick() {
            const click = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            click.type = 'square';
            click.frequency.value = 800;
            gain.gain.value = 0.5;
            const panner = audioCtx.createPanner();
            panner.panningModel = 'HRTF';
            panner.distanceModel = 'inverse';
            panner.positionX.setValueAtTime(camera.position.x, audioCtx.currentTime);
            panner.positionY.setValueAtTime(camera.position.y, audioCtx.currentTime);
            panner.positionZ.setValueAtTime(camera.position.z, audioCtx.currentTime);
            click.connect(gain).connect(panner).connect(audioCtx.destination);
            click.start();
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            click.stop(audioCtx.currentTime + 0.5);
        }

        function updatePsyche() {
            if (!analyser) return;
            const data = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(data);
            let bassSum = 0;
            for(let i=0; i<50; i++) { bassSum += data[i]; }
            panicLevel = bassSum / 50;
            if (panicLevel > 15) {
                TWEEN.update(); 
                fearGain.gain.linearRampToValueAtTime(0.8, audioCtx.currentTime + 0.2);
                camera.position.x += (Math.random() - 0.5) * 0.05;
                camera.position.z += (Math.random() - 0.5) * 0.05;
            } else {
                fearGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
            }
        }

        function animate() {
            if (!isRunning) return;
            if (keys['KeyW']) controls.getObject().translateZ(-speed);
            if (keys['KeyS']) controls.getObject().translateZ(speed);
            if (keys['KeyA']) controls.getObject().translateX(-speed);
            if (keys['KeyD']) controls.getObject().translateX(speed);
            requestAnimationFrame(animate);
            TWEEN.update();
            updatePsyche();
            composer.render();
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            document.getElementById('start-screen').style.display = 'none';
            isRunning = true;
            if (audioCtx.state === 'suspended') { await audioCtx.resume(); }
            initScene();
            await initAudio();
            animate();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
